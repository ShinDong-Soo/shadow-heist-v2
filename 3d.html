<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111719" />
    <title>Shadow Heist V2 — 3D Player Movement</title>
  </head>
  <body>
    <main id="prototype3D">
      <canvas id="renderCanvas" tabindex="0" aria-label="Shadow Heist Babylon.js 3D 플레이어 이동 장면"></canvas>
      <section id="loading3D" class="loading-3d" aria-live="polite">
        <span>SHADOW HEIST V2</span>
        <strong>Loading Player Movement...</strong>
        <div><i id="loadingProgress3D"></i></div>
        <small id="loadingStatus3D">ENGINE INITIALIZING</small>
      </section>
      <header class="prototype-3d-header">
        <span>BABYLON.JS PLAYER // PHASE 02</span>
        <strong>MOVEMENT + CAMERA LAB</strong>
      </header>
      <aside id="debug3D" class="debug-3d" aria-label="3D 성능 정보">
        <span>DEBUG</span>
        <b id="fps3D">FPS --</b>
        <small id="camera3D">CAMERA --</small>
        <small id="meshCount3D">MESHES --</small>
        <small id="movement3D">SPEED --</small>
        <small id="position3D">PLAYER --</small>
      </aside>
      <section class="prototype-3d-guide">
        <span>WASD</span> 이동
        <span>1·2·3</span> 카메라 거리 비교
        <span>R</span> 카메라 초기화
      </section>
      <a class="back-to-game" href="./">← 2D PROTOTYPE</a>
    </main>
    <script type="module" src="/src/3d/main.ts"></script>
  </body>
</html>
